<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#2563eb;--blue-light:#dbeafe;--blue-dark:#1e40af;
    --green:#16a34a;--green-light:#dcfce7;
    --amber:#d97706;--amber-light:#fef3c7;
    --red:#dc2626;--red-light:#fee2e2;
    --pink:#db2777;--pink-light:#fce7f3;
    --gray:#6b7280;--gray-light:#f3f4f6;
    --purple:#7c3aed;--purple-light:#ede9fe;
    --bg:#f0f4ff;--surface:#fff;--border:#e5e7eb;
    --text:#111827;--text2:#6b7280;--text3:#9ca3af;
    --header:#0f172a;
    --radius:10px;--radius-lg:14px;
    font-family:'DM Sans',sans-serif;
  }
  body{background:var(--bg);color:var(--text);min-height:100vh}
  button{cursor:pointer;font-family:'DM Sans',sans-serif}
  input,select{font-family:'DM Sans',sans-serif}

  /* ── SETUP SCREEN ── */
  #setup{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 60%,#312e81 100%)}
  .setup-card{background:#fff;border-radius:20px;padding:44px 48px;max-width:460px;width:100%;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.35)}
  .setup-icon{width:64px;height:64px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px}
  .setup-card h1{font-size:24px;font-weight:700;color:#0f172a;margin-bottom:8px}
  .setup-card p{color:#6b7280;font-size:14px;line-height:1.6;margin-bottom:28px}
  .setup-card input{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:13px;font-family:'DM Mono',monospace;margin-bottom:14px;outline:none;transition:border .2s}
  .setup-card input:focus{border-color:#2563eb}
  .setup-card .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;letter-spacing:.2px;transition:opacity .2s}
  .setup-card .btn-primary:hover{opacity:.9}
  .setup-tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:12px;color:#1d4ed8;margin-top:16px;text-align:left;line-height:1.5}

  /* ── APP LAYOUT ── */
  #app{display:none;flex-direction:column;min-height:100vh}
  header{background:var(--header);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
  .header-left{display:flex;align-items:center;gap:12px}
  .header-title{color:#fff;font-weight:700;font-size:17px;letter-spacing:-.3px}
  .badge-sheets{background:rgba(255,255,255,.12);color:#93c5fd;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;letter-spacing:.5px}
  .header-right{display:flex;align-items:center;gap:8px}
  .hbtn{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:500;transition:background .2s}
  .hbtn:hover{background:rgba(255,255,255,.14)}
  .hbtn.danger{background:rgba(220,38,38,.15);color:#fca5a5;border-color:rgba(220,38,38,.25)}
  .success-toast{background:#16a34a;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

  /* ── TABS ── */
  nav.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;display:flex}
  .tab{padding:14px 20px;border:none;background:none;font-size:13px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;transition:all .2s;cursor:pointer}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

  /* ── MAIN ── */
  main{padding:24px 28px;flex:1}

  /* ── METRIC CARDS ── */
  .metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .metric{background:#fff;border-radius:var(--radius-lg);padding:18px 20px;border:0.5px solid var(--border);border-top:3px solid var(--accent,#2563eb);position:relative;overflow:hidden}
  .metric-icon{font-size:20px;margin-bottom:6px}
  .metric-value{font-size:30px;font-weight:700;line-height:1;color:var(--text)}
  .metric-label{font-size:11px;color:var(--text2);margin-top:5px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}

  /* ── CHARTS ROW ── */
  .charts-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;margin-bottom:20px}
  .chart-card{background:#fff;border-radius:var(--radius-lg);padding:20px 22px;border:0.5px solid var(--border)}
  .card-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}

  /* progress bars */
  .pbar-row{margin-bottom:10px}
  .pbar-meta{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
  .pbar-bg{background:#f3f4f6;border-radius:4px;height:7px}
  .pbar-fill{height:7px;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}

  /* mini bars */
  .mini-bars{display:flex;align-items:flex-end;gap:5px;height:64px;margin-bottom:10px}
  .mini-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
  .mini-bar{width:100%;border-radius:3px 3px 0 0;min-height:4px;transition:height .5s}
  .mini-bar-label{font-size:9px;color:var(--text3);max-width:40px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-legend{font-size:10px}
  .mini-legend-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:.5px solid #f3f4f6}

  /* OK progress */
  .ok-progress{background:#fff;border-radius:var(--radius-lg);padding:18px 22px;border:0.5px solid var(--border);margin-bottom:20px}
  .ok-track{background:#f3f4f6;border-radius:8px;height:14px;margin:10px 0 6px}
  .ok-fill{height:14px;border-radius:8px;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width .8s cubic-bezier(.4,0,.2,1)}
  .ok-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}

  /* ── TOOLBAR ── */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input,.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;outline:none;background:#fff;transition:border .2s}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--blue)}
  .toolbar input{width:220px}
  .col-btn{padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;font-size:13px;display:flex;align-items:center;gap:6px;margin-left:auto}
  .col-count{background:var(--blue);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px}
  .rec-count{font-size:12px;color:var(--text2)}

  /* column picker dropdown */
  .col-picker-wrap{position:relative}
  .col-picker{position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;z-index:200;width:260px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
  .col-picker-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .col-picker label{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer;color:var(--text)}
  .col-picker label:hover{color:var(--blue)}
  .col-picker .apply-btn{width:100%;margin-top:10px;padding:8px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600}

  /* ── TABLE ── */
  .table-wrap{background:#fff;border-radius:var(--radius-lg);border:0.5px solid var(--border);overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead tr{background:#f8faff;border-bottom:1px solid var(--border)}
  th{padding:10px 12px;text-align:left;font-weight:700;color:var(--text2);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr{border-bottom:.5px solid #f3f4f6;transition:background .15s}
  tbody tr:hover{background:#f8faff}
  tbody tr.editing{background:#eff6ff}
  td{padding:8px 12px;color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}

  /* status badge */
  .badge{border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.2px;border:1px solid transparent}

  /* action buttons */
  .btn-ok{padding:4px 9px;border:none;border-radius:6px;font-size:12px;font-weight:700;background:#f3f4f6;color:var(--gray);transition:all .2s}
  .btn-ok.done{background:var(--green-light);color:var(--green)}
  .btn-ok:hover{background:var(--green-light);color:var(--green)}
  .btn-edit{padding:4px 9px;border:none;border-radius:6px;font-size:11px;font-weight:600;background:var(--blue-light);color:var(--blue)}

  /* inline editor */
  .edit-cell{display:flex;flex-direction:column;gap:5px;min-width:190px}
  .edit-row{display:flex;align-items:center;gap:5px}
  .edit-label{font-size:10px;color:var(--text2);width:58px;font-weight:600}
  .edit-row select{flex:1;padding:4px 6px;border-radius:6px;border:1px solid var(--border);font-size:11px;background:#fff}
  .edit-actions{display:flex;gap:5px;margin-top:2px}
  .btn-save{flex:1;padding:5px;background:var(--green);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700}
  .btn-cancel{flex:1;padding:5px;background:#f3f4f6;color:var(--gray);border:none;border-radius:6px;font-size:11px}

  /* empty / loading state */
  .empty{text-align:center;padding:60px 20px;color:var(--text2)}
  .empty-icon{font-size:40px;margin-bottom:12px}
  .empty h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
  .empty p{font-size:13px;color:var(--text2)}

  .error-bar{background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:10px 16px;margin-bottom:14px;color:#991b1b;font-size:13px}

  /* Spinner */
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{display:inline-block;animation:spin .8s linear infinite}
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup">
  <div class="setup-card">
    <div class="setup-icon">⚡</div>
    <h1>Portal de Gestão</h1>
    <p>Cole a URL do seu Google Apps Script para conectar à planilha e começar a gerenciar seus dados.</p>
    <input type="url" id="urlInput" placeholder="https://script.google.com/macros/s/..." autocomplete="off" spellcheck="false">
    <button class="btn-primary" onclick="conectar()">Conectar ao Google Sheets →</button>
    <div class="setup-tip">
      💡 <strong>Como obter a URL:</strong> No Google Sheets → Extensões → Apps Script → Implantar → Novo aplicativo da web → copie a URL gerada.
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-left">
      <span style="font-size:20px">⚡</span>
      <span class="header-title">Portal de Gestão</span>
      <span class="badge-sheets">GOOGLE SHEETS</span>
    </div>
    <div class="header-right">
      <span id="toastMsg" class="success-toast" style="display:none"></span>
      <button class="hbtn" onclick="fetchData()"><span id="refreshIcon">↻</span> Atualizar</button>
      <button class="hbtn danger" onclick="desconectar()">Desconectar</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" onclick="switchTab('tabela',this)">📋 Tabela de Dados</button>
    <button class="tab" onclick="switchTab('dashboard',this)">📊 Dashboard</button>
  </nav>

  <main>
    <div id="errorBar" class="error-bar" style="display:none"></div>

    <!-- DASHBOARD -->
    <div id="tabDashboard" style="display:none">
      <div class="metrics" id="metricsRow"></div>
      <div class="charts-row" id="chartsRow"></div>
      <div class="ok-progress" id="okProgress"></div>
    </div>

    <!-- TABELA -->
    <div id="tabTabela">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="🔍 Buscar em todos os campos..." oninput="renderTable()">
        <select id="filterStatus" onchange="renderTable()">
          <option value="">Todos os status</option>
          <option value="ANDAMENTO">ANDAMENTO</option>
          <option value="AGUARDANDO">AGUARDANDO</option>
          <option value="ENCERRADO">ENCERRADO</option>
          <option value="CANCELADO">CANCELADO</option>
          <option value="KARENA">KARENA</option>
        </select>
        <div class="col-picker-wrap">
          <button class="col-btn" onclick="toggleColPicker()">
            ⚙ Colunas <span class="col-count" id="colCount">0</span>
          </button>
          <div class="col-picker" id="colPicker" style="display:none">
            <div class="col-picker-title">Escolher Colunas</div>
            <div id="colCheckboxes"></div>
            <button class="apply-btn" onclick="toggleColPicker()">Aplicar</button>
          </div>
        </div>
        <span class="rec-count" id="recCount"></span>
      </div>
      <div class="table-wrap">
        <div id="tableContainer"></div>
      </div>
    </div>
  </main>
</div>

<script>
const SCRIPT_KEY = 'https://script.google.com/macros/s/AKfycbzbrXpijhmya4FtRKn9f5HC0yOtJpmYUreqNzQxMqjyWPv7nTf892ozqoYTwWgBxLRxeA/execl';
const COL_KEY = 'gestao_visible_cols';

const SETORES = ['TI','Financeiro','Comercial','Operações','RH','Logística','Suporte','Qualidade','Administrativo','Jurídico'];
const FABRICANTES = ['Dell','HP','Lenovo','Apple','Samsung','LG','Intelbras','Positivo','Microsoft','Epson','Outros'];

const STATUS_STYLE = {
  'ANDAMENTO':  {bg:'#dbeafe',color:'#1e40af',border:'#93c5fd'},
  'AGUARDANDO': {bg:'#fef3c7',color:'#92400e',border:'#fcd34d'},
  'ENCERRADO':  {bg:'#dcfce7',color:'#14532d',border:'#86efac'},
  'CANCELADO':  {bg:'#fee2e2',color:'#991b1b',border:'#fca5a5'},
  'KARENA':     {bg:'#fce7f3',color:'#9d174d',border:'#f9a8d4'},
  'KARENAA':    {bg:'#fce7f3',color:'#9d174d',border:'#f9a8d4'},
  'DEFAULT':    {bg:'#f3f4f6',color:'#374151',border:'#d1d5db'},
};

const ALL_COLS = [
  {key:'ID_OCORRENCIA',label:'ID'},
  {key:'SETOR',label:'Setor'},
  {key:'TIPO',label:'Tipo'},
  {key:'ORDEM_SERVICO',label:'OS'},
  {key:'URGENCIA',label:'Urgência'},
  {key:'DATA_HORA',label:'Data/Hora'},
  {key:'CATEGORIA',label:'Categoria'},
  {key:'STATUS',label:'Status'},
  {key:'DESCRICAO',label:'Descrição'},
  {key:'ATENDENTE',label:'Atendente'},
  {key:'CLIENTE',label:'Cliente'},
  {key:'CONTATO',label:'Contato'},
  {key:'VALOR',label:'Valor'},
  {key:'FABRICANTE',label:'Fabricante'},
  {key:'OK',label:'OK'},
  {key:'SETOR_GESTAO',label:'Setor Gestão'},
  {key:'FABRICANTE_GESTAO',label:'Fabricante Gestão'},
];

let scriptUrl = '';
let allRows = [];
let visibleCols = JSON.parse(localStorage.getItem(COL_KEY) || 'null') || 
  ['ID_OCORRENCIA','DATA_HORA','STATUS','CATEGORIA','ATENDENTE','CLIENTE','OK','SETOR_GESTAO','FABRICANTE_GESTAO'];
let editingRow = null;
let savingRow = false;

// ── SETUP ──
function conectar() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url.startsWith('https://script.google.com')) {
    alert('Cole uma URL válida do Google Apps Script.');
    return;
  }
  localStorage.setItem(SCRIPT_KEY, url);
  scriptUrl = url;
  showApp();
  fetchData();
}

function desconectar() {
  localStorage.removeItem(SCRIPT_KEY);
  location.reload();
}

function showApp() {
  document.getElementById('setup').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  buildColPicker();
}

// ── DATA ──
async function fetchData() {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('spin');
  hideError();
  try {
    const res = await fetch(`${scriptUrl}?action=getData`);
    const json = await res.json();
    if (json.success) {
      allRows = json.data || [];
      renderTable();
      renderDashboard();
    } else {
      showError(json.error || 'Erro ao carregar dados.');
    }
  } catch(e) {
    showError('Não foi possível conectar ao Apps Script. Verifique a URL e as permissões.');
  }
  icon.classList.remove('spin');
}

async function saveRow(rowData) {
  try {
    const res = await fetch(scriptUrl, {
      method: 'POST',
      body: JSON.stringify({action:'updateRow', ...rowData})
    });
    const json = await res.json();
    if (json.success) {
      toast('✓ Salvo com sucesso!');
      await fetchData();
      return true;
    } else {
      showError(json.error || 'Erro ao salvar.');
      return false;
    }
  } catch(e) {
    showError('Erro de conexão ao salvar.');
    return false;
  }
}

// ── TABLE ──
function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filterStatus = document.getElementById('filterStatus').value.toUpperCase();

  const filtered = allRows.filter(r => {
    const matchS = !filterStatus || (r.STATUS||'').toUpperCase().includes(filterStatus);
    const matchQ = !search || Object.values(r).some(v => String(v).toLowerCase().includes(search));
    return matchS && matchQ;
  });

  document.getElementById('recCount').textContent = `${filtered.length} registros`;

  const cols = ALL_COLS.filter(c => visibleCols.includes(c.key));
  document.getElementById('colCount').textContent = cols.length;

  if (!filtered.length) {
    document.getElementById('tableContainer').innerHTML = `
      <div class="empty">
        <div class="empty-icon">📋</div>
        <h3>Nenhum registro encontrado</h3>
        <p>Cole dados na Aba 1 do Google Sheets,<br>sincronize e clique em Atualizar.</p>
      </div>`;
    return;
  }

  let html = '<table><thead><tr><th>AÇÕES</th>';
  cols.forEach(c => { html += `<th>${c.label.toUpperCase()}</th>`; });
  html += '</tr></thead><tbody>';

  filtered.forEach((row, i) => {
    const isEditing = editingRow === row._row;
    html += `<tr class="${isEditing ? 'editing' : ''}" data-row="${i}">`;

    // actions cell
    if (isEditing) {
      html += `<td>
        <div class="edit-cell">
          <div class="edit-row">
            <span class="edit-label">OK:</span>
            <select id="ed_ok"><option value="">—</option><option value="✓" ${row._edOK==='✓'?'selected':''}>✓ OK</option><option value="Revisar" ${row._edOK==='Revisar'?'selected':''}>Revisar</option></select>
          </div>
          <div class="edit-row">
            <span class="edit-label">Setor:</span>
            <select id="ed_setor"><option value="">—</option>${SETORES.map(s=>`<option value="${s}" ${row._edSetor===s?'selected':''}>${s}</option>`).join('')}</select>
          </div>
          <div class="edit-row">
            <span class="edit-label">Fabric.:</span>
            <select id="ed_fab"><option value="">—</option>${FABRICANTES.map(f=>`<option value="${f}" ${row._edFab===f?'selected':''}>${f}</option>`).join('')}</select>
          </div>
          <div class="edit-actions">
            <button class="btn-save" onclick="confirmEdit(${row._row})">✓ Salvar</button>
            <button class="btn-cancel" onclick="cancelEdit()">✕</button>
          </div>
        </div>
      </td>`;
    } else {
      const isOK = row.OK === '✓' || String(row.OK).toUpperCase() === 'OK';
      html += `<td style="white-space:nowrap">
        <button class="btn-ok ${isOK?'done':''}" onclick="quickOK(${i})" title="Marcar OK">${isOK ? '✓' : 'OK'}</button>
        <button class="btn-edit" onclick="startEdit(${i})" title="Editar">✎</button>
      </td>`;
    }

    cols.forEach(c => {
      const val = row[c.key] || '—';
      if (c.key === 'STATUS') {
        const up = String(val).toUpperCase();
        const key = Object.keys(STATUS_STYLE).find(k => up.includes(k)) || 'DEFAULT';
        const s = STATUS_STYLE[key];
        html += `<td><span class="badge" style="background:${s.bg};color:${s.color};border-color:${s.border}">${val}</span></td>`;
      } else {
        html += `<td title="${val}">${val}</td>`;
      }
    });

    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('tableContainer').innerHTML = html;

  // Pre-fill edit selects with current values
  if (editingRow !== null) {
    const row = allRows.find(r => r._row === editingRow);
    if (row) {
      const okEl = document.getElementById('ed_ok');
      const setEl = document.getElementById('ed_setor');
      const fabEl = document.getElementById('ed_fab');
      if (okEl) okEl.value = row.OK || '';
      if (setEl) setEl.value = row.SETOR_GESTAO || '';
      if (fabEl) fabEl.value = row.FABRICANTE_GESTAO || '';
    }
  }
}

function startEdit(filteredIdx) {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filterStatus = document.getElementById('filterStatus').value.toUpperCase();
  const filtered = allRows.filter(r => {
    const matchS = !filterStatus || (r.STATUS||'').toUpperCase().includes(filterStatus);
    const matchQ = !search || Object.values(r).some(v => String(v).toLowerCase().includes(search));
    return matchS && matchQ;
  });
  const row = filtered[filteredIdx];
  if (row) { editingRow = row._row; renderTable(); }
}

function cancelEdit() { editingRow = null; renderTable(); }

async function confirmEdit(rowNum) {
  const ok = document.getElementById('ed_ok')?.value || '';
  const setor = document.getElementById('ed_setor')?.value || '';
  const fab = document.getElementById('ed_fab')?.value || '';
  const saved = await saveRow({_row: rowNum, OK: ok, SETOR_GESTAO: setor, FABRICANTE_GESTAO: fab});
  if (saved) editingRow = null;
}

async function quickOK(filteredIdx) {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filterStatus = document.getElementById('filterStatus').value.toUpperCase();
  const filtered = allRows.filter(r => {
    const matchS = !filterStatus || (r.STATUS||'').toUpperCase().includes(filterStatus);
    const matchQ = !search || Object.values(r).some(v => String(v).toLowerCase().includes(search));
    return matchS && matchQ;
  });
  const row = filtered[filteredIdx];
  if (!row) return;
  await saveRow({_row: row._row, OK: '✓', SETOR_GESTAO: row.SETOR_GESTAO||'', FABRICANTE_GESTAO: row.FABRICANTE_GESTAO||''});
}

// ── COL PICKER ──
function buildColPicker() {
  let html = '';
  ALL_COLS.forEach(c => {
    const chk = visibleCols.includes(c.key) ? 'checked' : '';
    html += `<label><input type="checkbox" value="${c.key}" ${chk} onchange="toggleCol('${c.key}',this.checked)"> ${c.label}</label>`;
  });
  document.getElementById('colCheckboxes').innerHTML = html;
}

function toggleCol(key, checked) {
  if (checked) { if (!visibleCols.includes(key)) visibleCols.push(key); }
  else { visibleCols = visibleCols.filter(k => k !== key); }
  localStorage.setItem(COL_KEY, JSON.stringify(visibleCols));
  renderTable();
}

let colPickerOpen = false;
function toggleColPicker() {
  colPickerOpen = !colPickerOpen;
  document.getElementById('colPicker').style.display = colPickerOpen ? 'block' : 'none';
}
document.addEventListener('click', e => {
  if (colPickerOpen && !e.target.closest('.col-picker-wrap')) {
    colPickerOpen = false;
    document.getElementById('colPicker').style.display = 'none';
  }
});

// ── TABS ──
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tabTabela').style.display = name === 'tabela' ? 'block' : 'none';
  document.getElementById('tabDashboard').style.display = name === 'dashboard' ? 'block' : 'none';
}

// ── DASHBOARD ──
function renderDashboard() {
  const total = allRows.length;
  const okCount = allRows.filter(r => r.OK === '✓' || String(r.OK).toUpperCase() === 'OK').length;
  const pending = total - okCount;

  const statusCounts = {};
  allRows.forEach(r => {
    const up = (r.STATUS||'OUTROS').toUpperCase();
    const key = Object.keys(STATUS_STYLE).find(k => k !== 'DEFAULT' && up.includes(k)) || 'OUTROS';
    statusCounts[key] = (statusCounts[key]||0) + 1;
  });

  const fabCounts = topN(allRows.map(r => r.FABRICANTE_GESTAO || r.FABRICANTE || 'N/A'), 6);
  const setorCounts = topN(allRows.map(r => r.SETOR_GESTAO || r.SETOR || 'N/A'), 6);

  // Metrics
  const metrics = [
    {icon:'📁',label:'Total Registros',value:total,accent:'#2563eb'},
    {icon:'✅',label:'Com OK',value:okCount,accent:'#16a34a'},
    {icon:'⏳',label:'Pendentes',value:pending,accent:'#d97706'},
    {icon:'🔵',label:'Em Andamento',value:statusCounts['ANDAMENTO']||0,accent:'#3b82f6'},
    {icon:'✔',label:'Encerrados',value:statusCounts['ENCERRADO']||0,accent:'#16a34a'},
  ];
  document.getElementById('metricsRow').innerHTML = metrics.map(m =>
    `<div class="metric" style="--accent:${m.accent}">
      <div class="metric-icon">${m.icon}</div>
      <div class="metric-value">${m.value}</div>
      <div class="metric-label">${m.label}</div>
    </div>`
  ).join('');

  // Charts
  const maxStatus = Math.max(...Object.values(statusCounts), 1);
  const statusBars = Object.entries(statusCounts).map(([k,v]) => {
    const s = STATUS_STYLE[k] || STATUS_STYLE.DEFAULT;
    const pct = Math.round((v/total)*100);
    return `<div class="pbar-row">
      <div class="pbar-meta"><span style="color:${s.color};font-weight:600;font-size:11px">${k}</span><span style="font-size:11px;color:#6b7280">${v} (${pct}%)</span></div>
      <div class="pbar-bg"><div class="pbar-fill" style="width:${pct}%;background:${s.border}"></div></div>
    </div>`;
  }).join('');

  const fabBarsHTML = miniBarHTML(fabCounts, '#7c3aed');
  const setorBarsHTML = miniBarHTML(setorCounts, '#16a34a');

  document.getElementById('chartsRow').innerHTML = `
    <div class="chart-card">
      <div class="card-title">Status por Categoria</div>
      ${statusBars}
    </div>
    <div class="chart-card">
      <div class="card-title">Por Fabricante</div>
      ${fabBarsHTML}
    </div>
    <div class="chart-card">
      <div class="card-title">Por Setor</div>
      ${setorBarsHTML}
    </div>`;

  // OK Progress
  const pct = total > 0 ? Math.round((okCount/total)*100) : 0;
  document.getElementById('okProgress').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;font-weight:700;color:#111827">Progresso de OK</span>
      <span style="font-size:18px;font-weight:700;color:#16a34a">${pct}%</span>
    </div>
    <div class="ok-track"><div class="ok-fill" style="width:${pct}%"></div></div>
    <div class="ok-meta"><span>${okCount} aprovados</span><span>${pending} pendentes</span></div>`;
}

function topN(arr, n) {
  const counts = {};
  arr.forEach(v => { counts[v] = (counts[v]||0)+1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function miniBarHTML(entries, color) {
  if (!entries.length) return '<div style="color:#9ca3af;font-size:12px">Sem dados</div>';
  const max = Math.max(...entries.map(e=>e[1]), 1);
  const bars = entries.map(([label, value]) =>
    `<div class="mini-bar-wrap">
      <div class="mini-bar" style="height:${Math.round((value/max)*100)}%;background:${color};opacity:${0.2 + (value/max)*0.8}"></div>
      <span class="mini-bar-label">${label}</span>
    </div>`
  ).join('');
  const legend = entries.map(([label,value]) =>
    `<div class="mini-legend-row"><span style="color:#374151">${label}</span><span style="font-weight:600;color:${color}">${value}</span></div>`
  ).join('');
  return `<div class="mini-bars">${bars}</div><div class="mini-legend">${legend}</div>`;
}

// ── UTILS ──
function toast(msg) {
  const el = document.getElementById('toastMsg');
  el.textContent = msg;
  el.style.display = 'inline-block';
  setTimeout(() => { el.style.display = 'none'; }, 2800);
}
function showError(msg) {
  const el = document.getElementById('errorBar');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('errorBar').style.display = 'none';
}

// ── INIT ──
const saved = localStorage.getItem(SCRIPT_KEY);
if (saved) {
  scriptUrl = saved;
  showApp();
  fetchData();
}
</script>
